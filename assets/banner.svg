<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow1 {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.1); }
      }
      @keyframes pulseGlow2 {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.30; transform: scale(1.15); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes badgePulse {
        0%, 100% { stroke: #38bdf8; }
        50% { stroke: #c084fc; }
      }
      .bg-pulse-1 { animation: pulseGlow1 5s ease-in-out infinite; transform-origin: 150px 150px; }
      .bg-pulse-2 { animation: pulseGlow2 7s ease-in-out infinite 1.5s; transform-origin: 850px 150px; }
      .line-anim { stroke-dasharray: 6 5; animation: dashMove 12s linear infinite; }
      .float-1 { animation: floatSlow 4.5s ease-in-out infinite; }
      .float-2 { animation: floatAlt 5.5s ease-in-out infinite 1s; }
      .badge-border { animation: badgePulse 3.5s ease-in-out infinite; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" rx="16" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Animated Ambient Lights -->
  <circle cx="150" cy="150" r="140" fill="#38bdf8" class="bg-pulse-1" filter="url(#glow)" />
  <circle cx="850" cy="150" r="130" fill="#818cf8" class="bg-pulse-2" filter="url(#glow)" />
  <circle cx="500" cy="220" r="90" fill="#c084fc" opacity="0.1" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="1000" y2="50" />
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="250" x2="1000" y2="250" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
  </g>

  <!-- Left ITAM Network Graphic -->
  <g class="float-1" opacity="0.9">
    <path d="M 70 80 L 140 140 L 70 200 L 140 140 L 210 140 L 250 80" stroke="#38bdf8" stroke-width="1.5" fill="none" class="line-anim" opacity="0.7" />
    <path d="M 140 140 L 210 210" stroke="#818cf8" stroke-width="1.5" fill="none" class="line-anim" opacity="0.7" />

    <!-- Server Node -->
    <rect x="50" y="60" width="40" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#soft-glow)" />
    <line x1="58" y1="70" x2="74" y2="70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="82" cy="70" r="2" fill="#22c55e" />
    <line x1="58" y1="78" x2="74" y2="78" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="82" cy="78" r="2" fill="#22c55e" />
    <line x1="58" y1="86" x2="74" y2="86" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="82" cy="86" r="2" fill="#38bdf8" />

    <!-- Central CMDB Hub Node -->
    <circle cx="140" cy="140" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#soft-glow)" />
    <circle cx="140" cy="140" r="10" fill="#38bdf8" opacity="0.8" />
    <circle cx="140" cy="140" r="4" fill="#ffffff" />

    <!-- Endpoint Node -->
    <rect x="50" y="184" width="40" height="26" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 46 210 L 94 210" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="70" cy="194" r="3" fill="#c084fc" />

    <!-- Cloud Tag Node -->
    <rect x="190" y="194" width="44" height="30" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="212" y="214" font-family="monospace" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="bold">ITAM</text>
  </g>

  <!-- Right Topology Graphic -->
  <g class="float-2" opacity="0.9">
    <path d="M 930 80 L 860 140 L 930 200 L 860 140 L 790 140 L 750 200" stroke="#c084fc" stroke-width="1.5" fill="none" class="line-anim" opacity="0.7" />
    <path d="M 860 140 L 790 80" stroke="#818cf8" stroke-width="1.5" fill="none" class="line-anim" opacity="0.7" />

    <!-- Cloud Node -->
    <rect x="910" y="60" width="40" height="36" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" filter="url(#soft-glow)" />
    <circle cx="924" cy="78" r="6" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="936" cy="76" r="4" fill="none" stroke="#c084fc" stroke-width="1.5" />

    <!-- Right Hub -->
    <circle cx="860" cy="140" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#soft-glow)" />
    <circle cx="860" cy="140" r="10" fill="#c084fc" opacity="0.8" />
    <circle cx="860" cy="140" r="4" fill="#ffffff" />

    <!-- Database Node -->
    <rect x="910" y="184" width="40" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="930" cy="192" rx="12" ry="3" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 918 192 v 10 c 0 2.5 5.5 4.5 12 4.5 s 12 -2 12 -4.5 v -10" fill="none" stroke="#38bdf8" stroke-width="1.5" />

    <!-- SAM License Node -->
    <rect x="768" y="64" width="44" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="790" y="84" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">SAM</text>
  </g>

  <!-- Central Content -->
  <g text-anchor="middle">
    <!-- Top Chip / Tag -->
    <g transform="translate(500, 50)">
      <rect x="-145" y="-14" width="290" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" class="badge-border" />
      <circle cx="-120" cy="0" r="4" fill="#22c55e" />
      <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="600" letter-spacing="1.5">CURATED ITAM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="500" y="116" class="main-title" font-size="36" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#accent-grad)">IT Asset Management</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="152" class="sub-title" font-size="14.5" fill="#94a3b8" letter-spacing="0.2">
      Enterprise SaaS Platforms • Open-Source Discovery • CMDB • License Compliance
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(500, 204)">
      <!-- Badge 1: Hardware Inventory -->
      <g transform="translate(-210, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
        <text x="0" y="5" class="sub-title" font-size="12" fill="#e2e8f0" font-weight="500">💻 Hardware ITAM</text>
      </g>

      <!-- Badge 2: Software Licenses -->
      <g transform="translate(-70, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1" />
        <text x="0" y="5" class="sub-title" font-size="12" fill="#e2e8f0" font-weight="500">📜 Software SAM</text>
      </g>

      <!-- Badge 3: Network & CMDB -->
      <g transform="translate(70, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(192, 132, 252, 0.45)" stroke-width="1" />
        <text x="0" y="5" class="sub-title" font-size="12" fill="#e2e8f0" font-weight="500">🌐 CMDB &amp; DCIM</text>
      </g>

      <!-- Badge 4: Open Source -->
      <g transform="translate(210, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(34, 197, 94, 0.45)" stroke-width="1" />
        <text x="0" y="5" class="sub-title" font-size="12" fill="#e2e8f0" font-weight="500">⚡ 100% Free/OSS</text>
      </g>
    </g>

    <!-- Bottom Accent Border Line -->
    <line x1="150" y1="265" x2="850" y2="265" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>